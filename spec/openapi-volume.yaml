openapi: 3.0.0
info:
  title: Gateway Volume API
  version: 0.1.0
  description: Volume management API.
security:
  - APIKey: []
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    VolumeID:
      in: path
      name: volumeID
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ExtraParams:
      type: object
      additionalProperties: true
      description: Additional creation options, such as storageType (Basic or Advanced).
      example: {storageType: Advanced}
    CreateVolume:
      type: object
      additionalProperties: false
      required: [name, sizeGiB]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9]([A-Za-z0-9_-]*[A-Za-z0-9])?$'
        sizeGiB:
          type: integer
          format: int64
          minimum: 1
          description: Capacity in GiB. Minimum 500 for Basic or 100 for Advanced.
        extraParams:
          $ref: '#/components/schemas/ExtraParams'
    ResizeVolume:
      type: object
      additionalProperties: false
      required: [sizeGiB]
      properties:
        sizeGiB:
          type: integer
          format: int64
          minimum: 1
          description: Target capacity in GiB; expansion only.
    Volume:
      type: object
      required: [volumeID, name, mountIP, sizeGiB, extraParams, createdAt, updatedAt]
      properties:
        volumeID:
          type: string
          format: uuid
        name:
          type: string
        mountIP:
          type: string
          description: NFS mount IP address.
        sizeGiB:
          type: integer
          format: int64
        extraParams:
          $ref: '#/components/schemas/ExtraParams'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    VolumeDetail:
      allOf:
        - $ref: '#/components/schemas/Volume'
        - type: object
          required: [usedSizeGiB, totalMountPointNum]
          properties:
            usedSizeGiB:
              type: integer
              format: int64
              minimum: 0
              description: Used capacity in GiB.
            totalMountPointNum:
              type: integer
              description: Number of cloud mount points.
    VolumeList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Volume'
        total:
          type: integer
          format: int64
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /v2/volumes:
    post:
      operationId: CreateVolume
      summary: Create a volume
      parameters:
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolume'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        '200':
          description: Idempotent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: ListVolumes
      summary: List volumes
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Volume list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeList'
        default:
          $ref: '#/components/responses/Error'
  /v2/volumes/{volumeID}:
    parameters:
      - $ref: '#/components/parameters/VolumeID'
    get:
      operationId: GetVolume
      summary: Get volume details
      responses:
        '200':
          description: Volume details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeDetail'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: ResizeVolume
      summary: Expand a volume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeVolume'
      responses:
        '200':
          description: Updated volume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volume'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteVolume
      summary: Delete a volume
      description: Checks every page of running and paused sandboxes in the project for volume v2 metadata references before deleting. A failed mount check leaves the volume intact. The check is not atomic with concurrent sandbox creation.
      responses:
        '204':
          description: Deleted
        '409':
          description: A running or paused sandbox references this volume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream sandbox mount check or cloud deletion failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'